# Beamline config for the SPEC dashboard: CHESS ID3A.
#
# This is the default config (used when --config isn't given). It starts as
# a copy of configs/qm2.yaml with the ID4B-only values cleared, and every tab
# and readout card kept so you can see what's there; unknown values show as
# "—". configs/qm2.yaml has the full comments for each setting.
#
# Lines marked TODO(ID3A) still hold QM2 values, or are blank, and need
# checking for ID3A.

beamline:
  name: ID3A
  station: ID3A

app:
  title: ID3A Dashboard
  home_title: ID3A Beamline Dashboard          # TODO(ID3A): full beamline name
  home_subtitle: >-
    A native desktop viewer for SPEC scan files from CHESS ID3A, but it
    works with any standard SPEC-format file. It never modifies your
    experiment data. Three tools act, and only when you click: SPECtator
    sends points to the queue runner, Array Generation writes array files
    into a sample's aux folder, and FOXDEN JSONs writes the starter
    sample-metadata JSONs into a btr's metadata folder.
  about_text: >-
    Native Qt (PySide6) GUI for browsing SPEC scan files from CHESS ID3A.
    Never modifies source data. SPECtator (queue points), Array Generation
    (array files in aux sample folders) and FOXDEN JSONs (metadata JSONs in
    a btr's metadata folder) act only when you click.
  default_root: /nfs/chess/raw      # only until a cycle and btr are picked
  # cycle and btr dropdowns next to the Root box. Experiment folders are
  # <raw_root>/<cycle>/<beamline_dir>/<btr>/, always with an explicit
  # cycle (no "current" links). The cycle dropdown lists the folders under
  # raw_root whose names fully match cycle_pattern (e.g. 2026-3); it starts
  # at the cycle picked last time, else the highest. The btr dropdown lists
  # that cycle's folders matching btr_pattern (name-NNNN-x, e.g.
  # hedstrom-5112-a); the most recently modified is picked. Picking one
  # points the Root box and file browser at it, and tools get the cycle
  # and btr.
  raw_root: /nfs/chess/raw
  beamline_dir: id3a
  cycle_pattern: '\d{4}-\d'
  btr_pattern: '[A-Za-z][A-Za-z-]*-\d{4}-[A-Za-z]'
  settings_prefix: id3a_dashboard

tabs:
  - key: home
    label: Home
  - key: summary
    label: Overall Summary
    description: >-
      Live readouts grouped as configured in the summary section of the
      beamline config, a No Beam banner, and a mini plot that always follows
      the latest scan.
  - key: plot
    label: SPEC data
    description: >-
      Pick X/Y columns, overlay multiple scans, switch
      line/scatter/line+scatter/bar, normalize, or use log scale. Optionally
      overlay a Gaussian or Lorentzian peak fit, a scan from a reference
      file, or the previous plot during Auto-Refresh. Save or copy the chart
      as a PNG image.
  - key: live_image
    label: Area Detectors
    description: >-
      Watch a folder of detector frames and see the newest one update in
      real time, with colormap choices and an optional ROI monitor.
  - key: timeline
    label: Folder Timeline
    description: >-
      Every scan across every SPEC file in a folder, sorted chronologically,
      with a data-folder lookup and a downloadable PDF experiment summary.
  - key: scan_info
    label: Scan Info
    description: >-
      Every scan's command, timestamp, temperature, count time, comments,
      and point count.
  - key: motor_positions
    label: Motor Positions
    description: Per-scan motor positions read from the SPEC header.
  - key: export
    label: Export
    description: >-
      Export all data, just the plotted data, or a chosen set of
      scans/columns to CSV.
  - key: ion_flux
    label: Ion Chamber Flux
    description: >-
      X-ray flux from ion chamber counts (gas, chamber length, energy,
      counter range), ported from the CHESS web calculator.
  - key: spectator
    label: SPECtator
    description: >-
      the SPECtator runner's queue of map points: what's running, holds and
      OKs, drag-and-drop reordering, and importing old mapscan files.
  - key: slack_alerts
    label: Slack Alerts
    description: >-
      Post a Slack message automatically whenever beam is lost or restored.
      Runs in the background regardless of which tab is open.

spectator:                  # the SPECtator runner (SPECtator tab)
  # Leave url out to show only the stage map: then nothing in the tab
  # can queue points or steer the runner.
  url: http://127.0.0.1:8765          # its local API (the runner's api: section)
  client_path: /nfs/chess/user/ad785/codes/spectator   # checkout with spectator/client.py
  poll_s: 1.0                         # seconds between status polls
  # The read-only stage service (python -m spectator.stage; its stage:
  # section): the beam position and trail on the stage map.
  stage_url: http://127.0.0.1:8766
  trail_s: 120                        # seconds of trail shown

# Tools from other repos, each a Tools-menu tab (the contract is in
# tool_tabs.py). path is the repo root; widget is package.module:Class
# inside it; options go to the widget's constructor. A tool that can't
# load shows why in its tab; the rest of the dashboard isn't affected.
tools:
  - key: array_gen
    label: Array Generation
    description: >-
      Write ff/nf/tomo layer-scan array files (for
      do_{ff,nf,tomo}_scan_layers_array) into a sample's aux folder; the
      sample folder follows the btr chosen above until you pick one.
    path: /nfs/chess/user/chess_id3a/fast-scripts
    widget: array_generation_gui.array_gen_gui:ArrayGenPanel
    options: {mode: ff}
  - key: sample_jsons
    label: FOXDEN JSONs
    description: >-
      Write the four starter sample-metadata JSONs (ceria, ruby, no sample,
      generic) for a btr into its metadata folder; the cycle and btr follow
      the ones chosen above until you pick others.
    path: /nfs/chess/user/chess_id3a/fast-scripts
    widget: foxden_utils.create_sample_jsons_gui:SampleJsonsPanel

signals:
  status_page_url: http://new-status.chess.cornell.edu/ID3A

  no_beam:
    channel: cesr
    threshold: 0.5
    units: mA

  # Ion chambers IC0-IC4 and the diode are ID3A counters CNT00-CNT05 (raw
  # volts). CESR is the storage-ring current.
  channels:
    cesr:
      label: CESR
      spec_patterns: [cesr]
      pv: CESR_BR_POSI_A
      multiplier: 1                            # read 141.86 live (mA), 2026-09-24
      range: [-10, 1000]                       # QM2's permissive placeholder
    # Ion chambers ic0-ic4 are counters CNT00-CNT04.
    ic0: {label: IC0, spec_patterns: [ic0], pv: ID3A_CNT00_VLT, multiplier: 1, range: null}
    ic1: {label: IC1, spec_patterns: [ic1], pv: ID3A_CNT01_VLT, multiplier: 1, range: null}
    ic2: {label: IC2, spec_patterns: [ic2], pv: ID3A_CNT02_VLT, multiplier: 1, range: null}
    ic3: {label: IC3, spec_patterns: [ic3], pv: ID3A_CNT03_VLT, multiplier: 1, range: null}
    ic4: {label: IC4, spec_patterns: [ic4], pv: ID3A_CNT04_VLT, multiplier: 1, range: null}
    diode:
      label: Diode
      spec_patterns: [diode, pin_diode, pindiode, beam_stop_diode, beamstopdiode]   # TODO(ID3A): QM2's column names
      pv: ID3A_CNT05_VLT
      multiplier: 1
      range: null
    # Monochromator stabilizer, counter CNT06.
    mostab: {label: MOSTAB, spec_patterns: [mostab], pv: ID3A_CNT06_VLT, multiplier: 1, range: null}

  # EPICS Channel Access settings for pyepics, set inside the dashboard's
  # own process before it first connects: key k -> environment variable
  # EPICS_<K>. They override the shell's; beamline shells set
  # EPICS_CA_ADDR_LIST=127.0.0.1 with EPICS_CA_AUTO_ADDR_LIST=NO, which
  # finds no ID3A PVs. The CLASSE gateway serves them.
  epics:
    ca_addr_list: epics-gw.classe.cornell.edu
    ca_auto_addr_list: "NO"

  # Flux readout under each listed ion chamber's card, from its live
  # voltage, with the CHESS calculator's model (Ion Chamber Flux tab).
  # One gas for all chambers, picked on the Summary tab; `gas` is the default.
  # The energy and amplifier PVs are read over EPICS Channel Access
  # (pyepics), only when the Summary tab's Refresh button is clicked.
  flux:
    energy_pv: ID3A_MON_KEV            # a string PV, e.g. "51.996 keV"
    counts_per_volt: 100000            # counts = volts x this
    gas: Nitrogen
    chambers:
      # The SR570 amplifier of each chamber (IC0 -> AMP01, ...): its
      # sensitivity number and units, read as the IOC's state names
      # (e.g. "20" and "nA/V").
      ic0: {length_cm: 6, gain_pv: "ID3A_AMP01:sens_num.VAL", gain_units_pv: "ID3A_AMP01:sens_unit.VAL"}
      ic1: {length_cm: 6, gain_pv: "ID3A_AMP02:sens_num.VAL", gain_units_pv: "ID3A_AMP02:sens_unit.VAL"}
      ic2: {length_cm: 6, gain_pv: "ID3A_AMP03:sens_num.VAL", gain_units_pv: "ID3A_AMP03:sens_unit.VAL"}
      ic3: {length_cm: 6, gain_pv: "ID3A_AMP04:sens_num.VAL", gain_units_pv: "ID3A_AMP04:sens_unit.VAL"}
      ic4: {length_cm: 6, gain_pv: "ID3A_AMP05:sens_num.VAL", gain_units_pv: "ID3A_AMP05:sens_unit.VAL"}

summary:
  groups:
    - title: Beam Condition
      channels: [cesr, ic0, ic1, ic2, ic3, ic4, diode, mostab]

plot:
  default_y_priority: [ic1, diode, I0, I1]     # TODO(ID3A)
  x_fallback_columns: [Time, Epoch, time, epoch]

timeline:
  calibration_names: [ceo2, air, background, bg, empty, dark]   # TODO(ID3A)

data_layout:
  raw_data_subdirs: [raw6M, tiffs, rawpil, data, raw, images]   # TODO(ID3A)
  extra_scan_search_dirs: ["raw6M/{spec}", "raw6M/{spec}/standard", "tiffs/{spec}"]
  scan_folder_name: "{spec}_{scan:03d}"        # TODO(ID3A)

spec_parsing:
  # TODO(ID3A): QM2's temperature-controller comment format
  temperature_comment_regex: '[Tt]emperature\s+[Ss]etpoint\s+[Aa]t\s+(\d+\.?\d*)'

live_image:
  # The tab shows hexrdgui's Cartesian view of the whole instrument.
  # hexrd instrument file (.yml/.hexrd). Changes with each calibration.
  instrument: /nfs/chess/aux/cycles/2026-3/id3a/hedstrom-5112-a/dex_1.yml
  # Frame files are <panel>_<image_n><frame_extension>, one per panel, e.g.
  # <scan>/ff/ff1_000035.h5.
  frame_extension: .h5
  hdf5_path: [imageseries, images]             # group, dataset of the images
  # Panel (also the frame file prefix) -> flip before rendering: lr, ud
  # (numpy fliplr/flipud) or null. Same as dex_powder_int_config.yaml.
  panels:
    ff1: lr
    ff2: ud

slack:
  default_channel: "#beamline-status"          # TODO(ID3A)
